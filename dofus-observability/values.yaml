# =============================================================================
# Dofus Observability — Umbrella Chart Values
# =============================================================================

# -----------------------------------------------------------------------------
# Kafka (Strimzi) Configuration
# -----------------------------------------------------------------------------
kafka:
  replicas: 2
  version: 4.2.0
  logRetentionHours: 168

  storage:
    size: 5Gi
    storageClass: "local-path"

  externalAccess:
    enabled: false
    type: loadbalancer
    port: 9094

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  topic:
    partitions: 2
    replicas: 2
    retentionMs: 604800000

# -----------------------------------------------------------------------------
# loki-stack (Sub-chart)
# -----------------------------------------------------------------------------
loki-stack:
  enabled: true
  promtail:
    enabled: false
  loki:
    persistence:
      enabled: true
      storageClassName: ""
      size: 2Gi

    # Activate the Ruler to process your bot-alerts.yaml
    config:
      ruler:
        enable_api: true
        storage:
          type: local
          local:
            directory: /etc/loki/rules
        rule_path: /tmp/loki/rules-temp
        # Dynamically points to Alertmanager based on your Helm release name
        alertmanager_url: "http://dofus-observability-kube-prometheus-alertmanager.default.svc.cluster.local:9093"
        ring:
          kvstore:
            store: inmemory

    # Mount the ConfigMap we created in templates/loki-alerts-cm.yaml
    extraVolumes:
      - name: loki-alerts-volume
        configMap:
          name: "dofus-observability-loki-alerts"
      - name: tmp-rules
        emptyDir: {}

    extraVolumeMounts:
      - name: loki-alerts-volume
        mountPath: /etc/loki/rules/fake
      - name: tmp-rules
        mountPath: /tmp/loki/rules-temp

strimzi-kafka-operator:
  enabled: true

# ------------------------------------------------------------------------------
# Ingress Controller (The API Gateway)
# ------------------------------------------------------------------------------
ingress-nginx:
  enabled: true
  controller:
    ingressClassResource:
      name: nginx
    hostPort:
      enabled: false
    service:
      type: LoadBalancer
    admissionWebhooks:
      enabled: false

# ------------------------------------------------------------------------------
# Visualization & Alerting (Prometheus & Grafana)
# ------------------------------------------------------------------------------
kube-prometheus-stack:
  enabled: true

  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true

  prometheus:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - prometheus.dofus.local
    prometheusSpec:
      enableRemoteWriteReceiver: true
      # =================================================================
      # THE LOBOTOMY: Tell Prometheus to ignore all default scraping targets
      # =================================================================
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          scrape-engine: "opentelemetry-only" # Fake label, so it finds nothing
      podMonitorSelector:
        matchLabels:
          scrape-engine: "opentelemetry-only" # Fake label, so it finds nothing

  grafana:
    enabled: true
    adminPassword: "admin"
    persistence:
      enabled: true
      type: pvc
      size: 2Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: "local-path"
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.dofus.local
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://dofus-observability-loki.default.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          manageAlerts: true
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "fake"

  alertmanager:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - alertmanager.dofus.local
    config:
      global:
        resolve_timeout: 5m

      route:
        group_by: ["alertname", "server"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

        # -------------------------------------------------------------
        # THE DEFAULT: If an alert doesn't have a specific rule,
        # assume it's a Prometheus/System alert and send it to Infra.
        # -------------------------------------------------------------
        receiver: "prometheus-alerts"

        routes:
          # 1. BOT ALERTS: Intercept anything with the label 'source="loki"'
          - matchers:
              - source="loki"
            receiver: "loki-alerts"
            # Nested rule: If it's a bot alert AND it's critical, send it faster!
            routes:
              - matchers:
                  - severity="critical"
                receiver: "loki-alerts"
                group_wait: 10s

      # ===============================================================
      # THE RECEIVERS (Your Discord Webhooks)
      # ===============================================================
      receivers:
        # The Infra Destination (Prometheus/Kubernetes)
        - name: "prometheus-alerts"
          discord_configs:
            - webhook_url: "https://discordapp.com/api/webhooks/1504429797059592296/gyva0v-6N_wBvKN9EM9GTNTr91hfwZttykKNR2xrmGs68VfLpHZlmRDP8G3q3lnNucFd"
              title: "🔧 SYSTEM {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}"
              message: |-
                {{ range .Alerts }}
                **Summary:** {{ .Annotations.summary }}
                **Details:** {{ .Annotations.description }}
                -------------------------------------------
                {{ end }}

        # The Bot Destination (Loki)
        - name: "loki-alerts"
          discord_configs:
            - webhook_url: "https://discordapp.com/api/webhooks/1504421877290893375/pFGMLOT6OBxhpAf-h0W8ZTLI5TYaOIdxziN5ICTufPXiBUkU285RbwsB8utsbWYjh1yG"
              title: "🤖 BOT {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}"
              message: |-
                {{ range .Alerts }}
                **Summary:** {{ .Annotations.summary }}
                **Bot:** {{ .Labels.bot_id }} | **Server:** {{ .Labels.server }}
                -------------------------------------------
                {{ end }}

# ------------------------------------------------------------------------------
# OpenTelemetry Collector Configuration
# ------------------------------------------------------------------------------
otel-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.100.0"

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions", "networking.k8s.io"]
        resources: ["ingresses"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

  config:
    receivers:
      kafka:
        brokers:
          - dofus-kafka-kafka-bootstrap.default.svc.cluster.local:9092
        topic: bot_events
        group_id: otel-log-readers
        initial_offset: earliest
        encoding: json

      prometheus:
        config:
          scrape_configs:
            - job_name: "otel-kubernetes-pods"
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
            # 2. NEW: Scrape Node Exporter (Server Hardware Metrics)
            - job_name: "otel-node-exporter"
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  # Matches the service name created by kube-prometheus-stack
                  regex: dofus-observability-prometheus-node-exporter

            # 3. NEW: Scrape Kube State Metrics (Kubernetes Status Metrics)
            - job_name: "otel-kube-state-metrics"
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  # Matches the service name created by kube-prometheus-stack
                  regex: dofus-observability-kube-state-metrics

            # 4. NEW: Scrape the Kubernetes Brain (etcd)
            - job_name: "etcd"
              # etcd metrics are almost always exposed on port 2381
              metrics_path: /metrics
              scheme: https
              tls_config:
                ca_file: /etc/kubernetes/pki/etcd/ca.crt
                cert_file: /etc/kubernetes/pki/etcd/healthcheck-client.crt
                key_file: /etc/kubernetes/pki/etcd/healthcheck-client.key
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: pod
                  # etcd always lives in the kube-system namespace
                  namespaces:
                    names: ["kube-system"]
              relabel_configs:
                # Only keep pods that have the label 'component=etcd'
                - source_labels: [__meta_kubernetes_pod_label_component]
                  action: keep
                  regex: etcd
                # Rewrite the port to 2381 (the standard etcd metrics port)
                - action: replace
                  source_labels: [__address__]
                  regex: ([^:]+)(?::\d+)?
                  replacement: $1:2381
                  target_label: __address__
                # Set the instance label to the Node name so Grafana variables work!
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: instance

    processors:
      batch:
        send_batch_size: 1000
        timeout: 1s

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["server"], body["character"]["server"])
              - set(resource.attributes["source"], "snowbot")
              - set(resource.attributes["botType"], body["botType"])
              - set(resource.attributes["loki.resource.labels"], "server, source,
                botType")

    exporters:
      debug:
        verbosity: detailed

      loki:
        endpoint:
          "http://dofus-observability-loki.default.svc.cluster.local:3100/loki/\
          api/v1/push"

      prometheusremotewrite:
        endpoint:
          "http://dofus-observability-kube-p-prometheus.default.svc.cluster.loc\
          al:9090/api/v1/write"
        tls:
          insecure: true

    service:
      telemetry:
        metrics:
          readers: []

      pipelines:
        traces: null

        logs:
          receivers: [kafka]
          processors: [transform, batch]
          exporters: [debug, loki]

        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [debug, prometheusremotewrite]
