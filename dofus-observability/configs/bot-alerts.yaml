groups:
  - name: dofus-bot-alerts
    rules:
      # ---------------------------------------------------------
      # ALERT 1: Banned Account Detected
      # ---------------------------------------------------------
      - alert: BannedAccountDetected
        # FIXED: Moved __error__="" before the range [30m]
        expr: sum(last_over_time({exporter="OTLP"} | json count="body.bannedAccountsCount" | unwrap count | __error__="" [30m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🚨 CRITICAL: Banned Account Detected"
          description: "One or more bots have been banned by the server!"

      # ---------------------------------------------------------
      # ALERT 2: Zero Ingestion (Pipeline Failure)
      # ---------------------------------------------------------
      - alert: ZeroLogIngestion
        # This one was already perfect!
        expr: absent_over_time({exporter="OTLP"}[20m])
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "⚠️ SYSTEM OFFLINE: Log Ingestion Stopped"
          description: "Loki has not received a single log from the OTLP exporter in 20 minutes."

      # ---------------------------------------------------------
      # ALERT 3: Total Kamas Drop (Brut + Bank + HDV)
      # ---------------------------------------------------------
      - alert: TotalKamasDrop
        expr: >
          (
            (
              sum by (bot_id, server) (max_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.bruts" | unwrap val | __error__="" [1h])) +
              sum by (bot_id, server) (max_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.inBank" | unwrap val | __error__="" [1h])) +
              sum by (bot_id, server) (max_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.inHdv" | unwrap val | __error__="" [1h]))
            )
            -
            (
              sum by (bot_id, server) (last_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.bruts" | unwrap val | __error__="" [5m])) +
              sum by (bot_id, server) (last_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.inBank" | unwrap val | __error__="" [5m])) +
              sum by (bot_id, server) (last_over_time({exporter="OTLP"} | json bot_id="body.character.id", server="body.character.server", val="body.kamas.inHdv" | unwrap val | __error__="" [5m]))
            )
          ) > 10
        for: 1m
        labels:
          severity: warning
          team: bot-ops
        annotations:
          summary: "📉 Kamas Total dropped on {{ $labels.bot_id }}"
          description: "Bot {{ $labels.bot_id }} on {{ $labels.server }} lost more than 10 total kamas (brut+bank+hdv) over the last hour."
