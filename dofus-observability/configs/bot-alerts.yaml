groups:
  - name: bot_fleet_health
    rules:
      # ---------------------------------------------------------
      # ALERT 1: Banned Account Detected
      # ---------------------------------------------------------
      - alert: BannedAccountDetected
        expr: sum(last_over_time({exporter="OTLP"} | json count="body.bannedAccountsCount" | unwrap count | __error__="" [1d])) > 0

        # Trigger if it stays > 0 for 1 minute
        for: 1m
        labels:
          severity: critical
          team: bot-ops
        annotations:
          summary: "🚨 CRITICAL: Banned Account Detected"
          description: "One or more bots have been banned by the server!"

      # ---------------------------------------------------------
      # ALERT 2: Zero Ingestion (Pipeline Failure)
      # ---------------------------------------------------------
      - alert: ZeroLogIngestion
        # Trigger if this specific stream is completely missing for 20 straight minutes
        expr: absent_over_time({exporter="OTLP"}[20m])

        # We don't need a 'for' delay here because the 20m window is already built into the query above!
        for: 0m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "⚠️ SYSTEM OFFLINE: Log Ingestion Stopped"
          description: "Loki has not received a single log from the OTLP exporter in 20 minutes. The bot server may be down or the network is partitioned."
